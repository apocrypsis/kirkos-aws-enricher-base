name: Run Unit Tests 

on:
  push:
    branches: [ main ]
  
  # Allow on-demand trigger.
  workflow_dispatch:

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest

    container:
      image: timberio/vector:0.60.0-debian

    steps:
      # Check out repository code onto the runner.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install gettext to be able to use envsubst
        run: |
          apt-get update
          apt-get install gettext-base

      - name: Run Unit Tests
        run: |
          chmod +x ./tests/run_tests.sh
          ./tests/run_tests.sh 